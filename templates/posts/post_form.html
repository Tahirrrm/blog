{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold">Новый пост</h1>
<form class="flex flex-col gap-4">
    <div>
            <label for="username" class="block text-sm text-zinc-500">
                Заголовок</label>
            <input type="text"
            id="title"
            name="title"
            placeholder="Заголовок"
            class="w-full px-4 py-2 border  text-base rounded-lg"/>
    </div>
        <div>
            <label for="text" class="block text-sm text-zinc-500">
                текст</label>
            <textarea
            id="text"
            name="text"
            placeholder="текст поста"
            class="w-full px-4 py-2 border  text-base rounded-lg min-h-20"></textarea>
        </div>
                <button 
                type="submit"
                class="flex items-center justify-center h-11 px-6 bg-black text-white bg-black text-base font-medium rounded-lg"
                >Создать</button>

</form>

{% endblock %}
