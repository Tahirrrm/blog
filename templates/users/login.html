{% extends "base.html" %}
{% block content %}
    <div class="w-4/12 border rounded-lg bg-white p-4 mx-auto border-zinc-300">
        <h1 class="font-bold text-2xl"></h1>
        <p class="font-sm text-zinc-500 font-medium">
            Войдите, чтобы создавать посты, комментировать и сохранить в избранное
        </p>
    
    <form method="post" class="mt-4 flex flex-col gap-4">
        {% csnf_token %}
        {{non_field_errors}}
        <div>
            <label for="username" class="block text-sm text-zinc-500">
                Имя пользователя</label>
            <input type="text"
            id="username"
            name="username"
            value= "{{ username_value}}"
            placeholder="Имя пользователя"

            class="w-full px-4 py-2 border-zinc-300 text-base rounded-lg"/>
            {{errors.username}}
        </div>
           <div>
            <label for="username" class="block text-sm text-zinc-500">
                пароль</label>
            <input type="text"
            id="password"
            name="password"
             placeholder="пароль"

            class="w-full px-4 py-2 border border-zinc-300 text-base rounded-lg">
            {{errors.password}}

            <button 
            type="submit"
            class="flex items-center justify-center h-11 px-6 bg-black text-white bg-black text-base font-medium rounded-lg"
            >Войти</button>

           
        <p class="mt-5 text-sm text-slate-600">нет аккаунта? <a href ="{% url 'register %}" class="text-blue-600">зарегистрироваться

            </a>
        </p>
    </form>
    </div>
</div>
{% endblock %}
