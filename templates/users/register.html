
{% extends "base.html" %}
{% block content %}
        <div class="w-4/12 border rounded-lg bg-white p-4 mx-auto border-zinc-300">
                <h1 class="font-bold text-2xl">Регистрация</h1>
                <p class="font-sm text-zinc-500 font-medium">
                Войдите, чтобы создавать посты, комментировать и сохранить в избранное
                </p>
    
         <form method="post" class="mt-4 flex flex-col gap-4">
                 {% csnf_token %}
        {{non_field_errors}}
                <div>
                        <label for="username" class="block text-sm text-zinc-500">
                        Имя пользователя</label>
                        <input type="text"
                        id="username"
                        name="username"
                        value="{{username_value}}"
                        placeholder="Имя пользователя"
                        class="w-full px-4 py-2 border border-zinc-300 text-base rounded-lg"/>
                                                            {{errors.username}}

                </div>

                <div>
                        <label for="password" class="block text-sm text-zinc-500">
                         Email</label>
                        <input type="text"
                        id="Email"
                        name="Email"
                        value="{{email_value}}"

                        placeholder="Email"

                        class="w-full px-4 py-2 border border-zinc-300 text-base rounded-lg"/>
                                    {{errors.email}}

                </div>
                <div>
                        <label for="password" class="block text-sm text-zinc-500">
                        пароль</label>
                        <input type="password"
                        id="password"
                        name="password"
                        placeholder="пароль"
                        class="w-full px-4 py-2 border border-zinc-300 text-base rounded-lg">
                                    {{errors.password}}

                     
                </div>
                        <div>
                                         <label for="password" class="block text-sm text-zinc-500">
                                         повторите пароль</label>
                                        <input type="password"
                                        id="password"
                                        name="password"
                                         placeholder="пароль"
                                        class="w-full px-4 py-2 border border-zinc-300 text-base rounded-lg">
                                                    {{errors.password2}}

                                      
                        </div>
                                
                                                <button 
                                                type="submit"
                                                class="flex items-center justify-center h-11 px-6 bg-black text-white bg-black text-base font-medium rounded-lg"
                                                 >Создать аккаунт</button>

           
                                        <p class="mt-5 text-sm text-slate-600 text-center">уже есть аккаунт <a href ="{% url 'login'%}" class="text-blue-600">Войти

                                                 </a>
                                        </p>
                        </form>
                         
        </div>
 
        {% endblock %}
